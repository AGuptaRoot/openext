<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CRM Follow-up Notes</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f172a;
        --card: #1e293b;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --border: #334155;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: radial-gradient(circle at top left, #1e3a5f, var(--bg));
        color: var(--text);
        min-height: 100vh;
        padding: 2rem;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        background: color-mix(in srgb, var(--card) 92%, transparent);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 1.75rem;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
      }
      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.6rem;
      }
      p { color: var(--muted); line-height: 1.5; }
      .meta {
        display: grid;
        gap: 0.5rem;
        margin: 1.25rem 0;
        padding: 1rem;
        border: 1px dashed var(--border);
        border-radius: 12px;
        font-size: 0.92rem;
      }
      .meta strong { color: var(--accent); }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 0.7rem 1.1rem;
        background: var(--accent);
        color: #0f172a;
        font-weight: 600;
        cursor: pointer;
      }
      #status { margin-top: 1rem; font-size: 0.9rem; color: var(--muted); }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.85em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Follow-up Notes</h1>
      <p>
        Sample extension page for <strong>openext-crm-suite</strong>.
        This HTML is served by the CMS extension asset route. It does not run on the server.
      </p>
      <div class="meta">
        <div><strong>Extension id:</strong> <code>crm-follow-up-notes</code></div>
        <div><strong>Target plugin:</strong> <code>openext-crm-suite</code></div>
        <div><strong>Asset URL:</strong> <code>/extensions/crm-follow-up-notes/ui/pages/follow-ups.html</code></div>
      </div>
      <button type="button" id="ping">Check CRM extension registry</button>
      <div id="status">Ready.</div>
    </main>
    <script>
      const status = document.querySelector('#status');
      document.querySelector('#ping').addEventListener('click', async () => {
        status.textContent = 'Calling CRM…';
        try {
          const response = await fetch('/api/plugins/openext-crm-suite/extensions', {
            credentials: 'include'
          });
          if (!response.ok) {
            throw new Error('HTTP ' + response.status);
          }
          const payload = await response.json();
          const items = Array.isArray(payload.data) ? payload.data : [];
          const mine = items.find((item) => item.extensionId === 'crm-follow-up-notes');
          status.textContent = mine
            ? 'Registered with CRM: ' + mine.extensionId + '@' + mine.version
            : 'CRM responded, but this extension is not registered yet. Enable it in Dashboard → Extensions.';
        } catch (error) {
          status.textContent = 'Could not reach CRM extensions API: ' + (error.message || error);
        }
      });
    </script>
  </body>
</html>
